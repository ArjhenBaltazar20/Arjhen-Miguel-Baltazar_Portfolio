<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Tri-Lens logo">
  <!-- Tile: the design lens -->
  <rect width="64" height="64" rx="15" fill="#1b365d"/>
  <!-- "A" drawn as a caret (^): the code lens -->
  <path d="M15 50 32 13 49 50" fill="none" stroke="#f5eded" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Rising bars as the crossbar: the data lens -->
  <rect x="24.5" y="41" width="4" height="7" rx="1.2" fill="#60c1e5"/>
  <rect x="30" y="37" width="4" height="11" rx="1.2" fill="#60c1e5"/>
  <rect x="35.5" y="33" width="4" height="15" rx="1.2" fill="#a0e0ef"/>
</svg>
